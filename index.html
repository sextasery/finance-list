<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1115">
<meta name="format-detection" content="telephone=no">
<title>Finance Shield</title>
<style>
    :root {
        --bg: #0f1115;
        --card: #1a1d24;
        --text: #e0e6ed;
        --dim: #9aa9c0;
        --green: #00d26a;
        --red: #ff4757;
        --blue: #00d2ff;
        --border: #2a3548;
        --min-touch: 44px;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
    }

    @supports not (height: 100dvh) {
        body { height: 100vh; }
    }

    :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
        border-radius: 4px;
    }

    /* HEADER */
    header {
        padding: calc(14px + var(--safe-top)) 15px 14px;
        background: linear-gradient(180deg, rgba(26,29,36,1) 0%, rgba(15,17,21,0) 100%);
        border-bottom: 1px solid var(--border);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        flex-shrink: 0;
    }
    .stat-box {
        background: var(--card);
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        min-width: 0;
    }
    .stat-label {
        font-size: 10px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }
    .stat-value {
        font-size: 20px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .balance-box { grid-column: span 2; border-color: var(--blue); }
    .balance-box .stat-value { color: var(--blue); font-size: 28px; }
    .debt-box .stat-value { color: var(--red); }
    .plans-box .stat-value { color: var(--green); }

    /* NAV */
    .nav-tabs {
        display: flex;
        padding: 0 8px;
        gap: 4px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        flex-shrink: 0;
    }
    .tab-btn {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--dim);
        padding: 14px 0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        min-height: var(--min-touch);
        font-family: inherit;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }

    /* FIXED FILTERS BAR — прибита под табами, не скроллится с контентом */
    .filters-bar {
        display: none;
        padding: 10px 15px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
    }
    .filters-bar.visible { display: block; }

    .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 2px 0;
    }

    .filter-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
        height: var(--min-touch);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border-radius: 22px;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        flex-shrink: 0;
        font-family: inherit;
        line-height: 1;
    }
    .filter-btn.active {
        background: var(--blue);
        color: #000;
        border-color: var(--blue);
        font-weight: bold;
    }

    /* CONTENT */
    .content {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 15px 15px calc(15px + var(--safe-bot));
        display: flex;
        flex-direction: column;
        gap: 15px;
        -webkit-overflow-scrolling: touch;
    }
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 15px;
    }
    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
    .card-title { font-size: 14px; font-weight: 600; color: var(--dim); }

    .btn-icon {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
        width: var(--min-touch);
        height: var(--min-touch);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 20px;
        padding: 0;
        font-family: inherit;
    }

    /* LISTS */
    .list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        gap: 8px;
    }
    .list-item:last-child { border-bottom: none; }
    .item-left { flex: 1 1 auto; min-width: 0; }
    .item-name {
        font-size: 15px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .item-sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .item-right { text-align: right; margin-left: 10px; flex-shrink: 0; }
    .item-amount { font-weight: bold; font-size: 15px; }
    .item-actions {
        margin-top: 6px;
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        flex-wrap: wrap;
    }

    .mini-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
        font-size: 13px;
        padding: 0 12px;
        border-radius: 6px;
        cursor: pointer;
        min-height: var(--min-touch);
        min-width: var(--min-touch);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        line-height: 1;
    }
    .mini-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .mini-btn.pay  { border-color: var(--green); color: var(--green); }
    .mini-btn.edit { border-color: var(--blue);  color: var(--blue); }
    .mini-btn.del  { border-color: var(--red);   color: var(--red); }
    .mini-btn.move { border-color: var(--dim);   color: var(--dim); }

    /* INPUTS */
    input {
        width: 100%;
        background: #0a0c10;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 10px;
        outline: none;
        font-family: inherit;
        -webkit-user-select: text;
        user-select: text;
    }
    input:focus { border-color: var(--blue); }
    input[type="file"] { display: none; }

    .btn-full {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
        min-height: var(--min-touch);
        font-family: inherit;
    }
    .btn-primary { background: var(--blue); color: #000; }
    .btn-danger  { background: var(--red);  color: #fff; }
    .btn-outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
        margin-top: 8px;
    }

    /* MODAL */
    .modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
        padding: 20px;
    }
    .modal-overlay.visible { display: flex; }
    .modal {
        background: var(--card);
        width: 100%;
        max-width: 400px;
        padding: 20px;
        border-radius: 16px;
        border: 1px solid var(--border);
        max-height: 80vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }
    .modal h3 { margin: 0 0 15px 0; color: var(--text); font-size: 18px; }

    .empty-state {
        text-align: center;
        color: var(--dim);
        padding: 30px 0;
        font-size: 13px;
        line-height: 1.5;
    }
    .progress-bg {
        height: 4px;
        background: #333;
        border-radius: 2px;
        margin: 8px 0;
        overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--green); }

    .summary-box {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.05);
        font-size: 12px;
        color: var(--dim);
        flex-wrap: wrap;
        gap: 6px;
    }
    .summary-val { font-weight: bold; font-size: 14px; }

    #errScreen {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #1a0a0a;
        color: #ff8888;
        padding: 20px;
        font: 12px/1.5 monospace;
        white-space: pre-wrap;
        overflow: auto;
        z-index: 9999;
        -webkit-user-select: text;
        user-select: text;
    }
</style>
</head>
<body>

<div id="errScreen"></div>

<header>
    <div class="stat-box balance-box">
        <div class="stat-label">Полный остаток</div>
        <div class="stat-value" id="totalBalance">0 ₽</div>
    </div>
    <div class="stat-box debt-box">
        <div class="stat-label">Мои долги</div>
        <div class="stat-value" id="totalDebt">0 ₽</div>
    </div>
    <div class="stat-box plans-box">
        <div class="stat-label">Планы (цели)</div>
        <div class="stat-value" id="totalPlans">0 ₽</div>
    </div>
</header>

<div class="nav-tabs" id="navTabs">
    <button class="tab-btn active" data-tab="balance" type="button">Остаток</button>
    <button class="tab-btn" data-tab="debts" type="button">Долги</button>
    <button class="tab-btn" data-tab="plans" type="button">Планы</button>
    <button class="tab-btn" data-tab="settings" type="button">⚙️</button>
</div>

<div class="filters-bar" id="filtersBar"></div>

<div class="content" id="mainContent"></div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
</div>

<script>
'use strict';

/* =========================================================================
   ГЛОБАЛЬНЫЙ ПЕРЕХВАТ ОШИБОК
   ========================================================================= */
(function installErrorScreen() {
    var screen = document.getElementById('errScreen');
    var shown = false;
    function show(msg) {
        if (shown) return;
        shown = true;
        screen.textContent = msg;
        screen.style.display = 'block';
    }
    window.addEventListener('error', function (e) {
        var info = 'ERROR: ' + (e.message || 'unknown') + '\n';
        if (e.filename) info += 'at ' + e.filename + ':' + (e.lineno || '?') + ':' + (e.colno || '?') + '\n\n';
        if (e.error && e.error.stack) info += e.error.stack;
        show(info);
    });
    window.addEventListener('unhandledrejection', function (e) {
        show('UNHANDLED PROMISE:\n' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)));
    });
})();

/* =========================================================================
   КОНСТАНТЫ
   ========================================================================= */
var STORAGE_KEY        = 'fin_shield_v7';
var HISTORY_LIMIT      = 5000;
var HISTORY_VIEW_LIMIT = 50;
var STATE_VERSION      = 7;

var TYPE = { INCOME: 'income', EXPENSE: 'expense', TRANSFER: 'transfer' };

var FILTERS = [
    { id: 'all',         label: 'Все'      },
    { id: TYPE.INCOME,   label: 'Доходы'   },
    { id: TYPE.EXPENSE,  label: 'Расходы'  },
    { id: TYPE.TRANSFER, label: 'Переводы' }
];

/* =========================================================================
   УТИЛИТЫ (ES5-совместимо)
   ========================================================================= */
var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) { return ESC_MAP[c]; });
}

function fmt(num) {
    var n = (typeof num === 'number' && isFinite(num)) ? Math.round(num) : 0;
    try { return n.toLocaleString('ru-RU') + ' ₽'; }
    catch (_) { return n + ' ₽'; }
}

function uid() {
    try {
        if (typeof crypto !== 'undefined' && crypto && typeof crypto.randomUUID === 'function') {
            return crypto.randomUUID();
        }
    } catch (_) {}
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function parseAmount(raw) {
    if (raw === null || raw === undefined) return null;
    var s = String(raw).replace(/\s/g, '').replace(',', '.').trim();
    if (!s) return null;
    var n = Number(s);
    return (isFinite(n) && n > 0) ? n : null;
}

function formatDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    try {
        return d.toLocaleDateString('ru-RU') + ' ' +
            d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    } catch (_) { return d.toString(); }
}

function formatDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    try { return d.toLocaleDateString('ru-RU'); }
    catch (_) { return d.toDateString(); }
}

/* =========================================================================
   СОСТОЯНИЕ
   ========================================================================= */
function emptyState() {
    return { version: STATE_VERSION, balance: 0, debts: [], plans: [], history: [] };
}

var state = emptyState();
var currentTab = 'balance';
var historyFilter = 'all';

/* =========================================================================
   PERSISTENCE
   ========================================================================= */
var storageAvailable = true;
try {
    var _t = '__fs_test__';
    window.localStorage.setItem(_t, '1');
    window.localStorage.removeItem(_t);
} catch (e) {
    storageAvailable = false;
}

function loadState() {
    if (!storageAvailable) return;
    try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        var parsed = JSON.parse(raw);
        state = migrate(parsed);
    } catch (e) {
        console.error('[FinanceShield] load error:', e);
        state = emptyState();
    }
}

function migrate(raw) {
    if (!raw || typeof raw !== 'object') return emptyState();
    var s = emptyState();
    s.balance = (typeof raw.balance === 'number' && isFinite(raw.balance)) ? raw.balance : 0;
    s.debts   = Array.isArray(raw.debts)   ? raw.debts.filter(isValidDebt)      : [];
    s.plans   = Array.isArray(raw.plans)   ? raw.plans.filter(isValidPlan)      : [];
    s.history = Array.isArray(raw.history) ? raw.history.filter(isValidHistory) : [];
    return s;
}

function isValidDebt(d) {
    return d && typeof d.to === 'string' && typeof d.amount === 'number' && isFinite(d.amount) && d.id != null;
}
function isValidPlan(p) {
    return p && typeof p.name === 'string' && typeof p.target === 'number' && isFinite(p.target)
        && typeof p.current === 'number' && isFinite(p.current) && p.id != null;
}
function isValidHistory(h) {
    return h && typeof h.date === 'string' && typeof h.amount === 'number' && isFinite(h.amount);
}

function saveState() {
    if (state.history.length > HISTORY_LIMIT) {
        state.history.length = HISTORY_LIMIT;
    }
    if (!storageAvailable) {
        renderHeader();
        return;
    }
    try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
        console.error('[FinanceShield] save error:', e);
        if (e && e.name === 'QuotaExceededError') {
            alert('Хранилище переполнено. Сделай экспорт и очисти историю.');
        }
    }
    renderHeader();
}

/* =========================================================================
   ХЕДЕР
   ========================================================================= */
function renderHeader() {
    document.getElementById('totalBalance').textContent = fmt(state.balance);

    var debtSum = 0;
    for (var i = 0; i < state.debts.length; i++) debtSum += state.debts[i].amount;
    document.getElementById('totalDebt').textContent = fmt(debtSum);

    var planSum = 0;
    for (var j = 0; j < state.plans.length; j++) planSum += state.plans[j].current;
    document.getElementById('totalPlans').textContent = fmt(planSum);
}

/* =========================================================================
   TABS
   ========================================================================= */
function switchTab(tab) {
    currentTab = tab;

    var tabs = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].getAttribute('data-tab') === tab) tabs[i].classList.add('active');
        else tabs[i].classList.remove('active');
    }

    // Фильтры — только на вкладке «Остаток»
    if (tab === 'balance') renderFiltersBar();
    else hideFiltersBar();

    var c = document.getElementById('mainContent');
    c.innerHTML = '';

    if (tab === 'balance')       renderBalance(c);
    else if (tab === 'debts')    renderDebts(c);
    else if (tab === 'plans')    renderPlans(c);
    else if (tab === 'settings') renderSettings(c);

    c.scrollTop = 0;
}

/* =========================================================================
   FIXED FILTERS BAR
   ========================================================================= */
function renderFiltersBar() {
    var bar = document.getElementById('filtersBar');
    if (!bar) return;

    var html = '<div class="filters">';
    for (var i = 0; i < FILTERS.length; i++) {
        var f = FILTERS[i];
        html += '<button type="button" class="filter-btn ' + (historyFilter === f.id ? 'active' : '') +
            '" data-action="filter" data-filter="' + f.id + '">' + f.label + '</button>';
    }
    html += '</div>';

    bar.innerHTML = html;
    bar.classList.add('visible');
}

function hideFiltersBar() {
    var bar = document.getElementById('filtersBar');
    if (bar) {
        bar.classList.remove('visible');
        bar.innerHTML = '';
    }
}

/* =========================================================================
   TAB: BALANCE
   ========================================================================= */
function renderBalance(c) {
    var formHtml =
        '<div class="card">' +
            '<div class="card-title" style="margin-bottom:10px">Операция с остатком</div>' +
            '<input type="text" id="opAmount" placeholder="Сумма" inputmode="decimal" autocomplete="off">' +
            '<input type="text" id="opDesc" placeholder="Комментарий" autocomplete="off">' +
            '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">' +
                '<button type="button" class="btn-full btn-primary" data-action="op" data-sign="1">+ Пополнить</button>' +
                '<button type="button" class="btn-full btn-danger"  data-action="op" data-sign="-1">− Списать</button>' +
            '</div>' +
        '</div>';

    var filtered = historyFilter === 'all'
        ? state.history
        : state.history.filter(function (h) { return h.type === historyFilter; });

    var historyHtml = '<div class="card"><div class="card-title">История операций</div>';

    if (filtered.length === 0) {
        historyHtml += '<div class="empty-state">Нет записей<br>Начни с пополнения баланса</div>';
    } else {
        var limit = Math.min(filtered.length, HISTORY_VIEW_LIMIT);
        for (var k = 0; k < limit; k++) {
            var h = filtered[k];
            var isPos = h.amount > 0;
            var color = isPos ? 'var(--green)' : 'var(--red)';
            var sign  = isPos ? '+' : '';
            historyHtml +=
                '<div class="list-item">' +
                    '<div class="item-left">' +
                        '<div class="item-name">' + (esc(h.desc) || 'Без описания') + '</div>' +
                        '<div class="item-sub">' + formatDateTime(h.date) + '</div>' +
                    '</div>' +
                    '<div class="item-right">' +
                        '<div class="item-amount" style="color:' + color + '">' + sign + fmt(h.amount) + '</div>' +
                    '</div>' +
                '</div>';
        }
    }

    var now = new Date();
    var startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    var income = 0, expense = 0;
    for (var m = 0; m < state.history.length; m++) {
        var rec = state.history[m];
        var d = new Date(rec.date);
        if (isNaN(d.getTime()) || d < startOfMonth) continue;
        if (rec.type === TYPE.INCOME) income += rec.amount;
        else if (rec.type === TYPE.EXPENSE) expense += Math.abs(rec.amount);
    }

    historyHtml +=
        '<div class="summary-box">' +
            '<span>Доходы: <span class="summary-val" style="color:var(--green)">' + fmt(income) + '</span></span>' +
            '<span>Расходы: <span class="summary-val" style="color:var(--red)">' + fmt(expense) + '</span></span>' +
        '</div>' +
    '</div>';

    c.innerHTML = formHtml + historyHtml;
}

function setHistoryFilter(f) {
    historyFilter = f;
    renderFiltersBar();
    renderBalance(document.getElementById('mainContent'));
}

function doOp(sign) {
    var amtInput  = document.getElementById('opAmount');
    var descInput = document.getElementById('opDesc');
    if (!amtInput || !descInput) return;

    var amt = parseAmount(amtInput.value);
    if (amt === null) {
        try { amtInput.focus(); } catch (_) {}
        return;
    }

    var desc = descInput.value.trim();
    var delta = amt * sign;

    if (sign < 0 && state.balance + delta < 0) {
        if (!confirm('Баланс станет отрицательным (' + fmt(state.balance + delta) + '). Продолжить?')) return;
    }

    state.balance += delta;
    state.history.unshift({
        date: new Date().toISOString(),
        type: sign > 0 ? TYPE.INCOME : TYPE.EXPENSE,
        desc: desc,
        amount: delta
    });

    saveState();
    renderBalance(document.getElementById('mainContent'));
}

/* =========================================================================
   TAB: DEBTS
   ========================================================================= */
function renderDebts(c) {
    var html =
        '<div class="card">' +
            '<div class="card-header">' +
                '<div class="card-title">Кому я должен</div>' +
                '<button type="button" class="btn-icon" data-action="add-debt" aria-label="Добавить долг">+</button>' +
            '</div>';

    if (state.debts.length === 0) {
        html += '<div class="empty-state">Долгов нет 🎉</div>';
    } else {
        var sorted = state.debts.slice().sort(function (a, b) {
            return new Date(a.createdAt || 0) - new Date(b.createdAt || 0);
        });
        for (var i = 0; i < sorted.length; i++) {
            var d = sorted[i];
            html +=
                '<div class="list-item">' +
                    '<div class="item-left">' +
                        '<div class="item-name">' + esc(d.to) + '</div>' +
                        '<div class="item-sub">Взял: ' + formatDate(d.createdAt) + '</div>' +
                    '</div>' +
                    '<div class="item-right">' +
                        '<div class="item-amount" style="color:var(--red)">' + fmt(d.amount) + '</div>' +
                        '<div class="item-actions">' +
                            '<button type="button" class="mini-btn pay" data-action="pay-debt" data-id="' + esc(d.id) + '">Вернул</button>' +
                            '<button type="button" class="mini-btn edit" data-action="edit-debt" data-id="' + esc(d.id) + '" aria-label="Изменить">✏️</button>' +
                            '<button type="button" class="mini-btn del" data-action="del-debt" data-id="' + esc(d.id) + '" aria-label="Удалить">✕</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
        }
    }

    html += '</div>';
    c.innerHTML = html;
}

function showAddDebt(existingId) {
    var d = (existingId != null) ? state.debts.filter(function (x) { return x.id === existingId; })[0] : null;
    showModal(
        '<h3>' + (d ? 'Изменить долг' : 'Новый долг') + '</h3>' +
        '<input type="text" id="debtTo" placeholder="Кому (Имя)" autocomplete="off" value="' + esc(d ? d.to : '') + '">' +
        '<input type="text" id="debtAmt" placeholder="Сумма" inputmode="decimal" autocomplete="off" value="' + (d ? d.amount : '') + '">' +
        '<button type="button" class="btn-full btn-primary" data-action="save-debt" data-id="' + (existingId != null ? esc(existingId) : '') + '">' +
            (d ? 'Сохранить' : 'Добавить') +
        '</button>' +
        '<button type="button" class="btn-full btn-outline" data-action="close-modal">Отмена</button>'
    );
}

function saveDebt(id) {
    var toEl = document.getElementById('debtTo');
    var amtEl = document.getElementById('debtAmt');
    var to = toEl ? toEl.value.trim() : '';
    var amt = amtEl ? parseAmount(amtEl.value) : null;
    if (!to || amt === null) return;

    if (id) {
        var found = null;
        for (var i = 0; i < state.debts.length; i++) {
            if (state.debts[i].id === id) { found = state.debts[i]; break; }
        }
        if (found) { found.to = to; found.amount = amt; }
    } else {
        state.debts.push({
            id: uid(),
            to: to,
            amount: amt,
            createdAt: new Date().toISOString()
        });
    }

    saveState();
    hideModal();
    renderDebts(document.getElementById('mainContent'));
}

function payDebt(id) {
    var d = null;
    for (var i = 0; i < state.debts.length; i++) {
        if (state.debts[i].id === id) { d = state.debts[i]; break; }
    }
    if (!d) return;

    if (state.balance < d.amount) {
        alert('Недостаточно средств на остатке.\nНужно: ' + fmt(d.amount) + '\nДоступно: ' + fmt(state.balance));
        return;
    }
    if (!confirm('Вернуть ' + fmt(d.amount) + ' долг "' + d.to + '"?\nЭто спишет деньги с остатка.')) return;

    state.balance -= d.amount;
    state.history.unshift({
        date: new Date().toISOString(),
        type: TYPE.TRANSFER,
        desc: 'Возврат долга: ' + d.to,
        amount: -d.amount
    });
    state.debts = state.debts.filter(function (x) { return x.id !== id; });

    saveState();
    renderDebts(document.getElementById('mainContent'));
}

function editDebt(id) { showAddDebt(id); }

function delDebt(id) {
    if (!confirm('Удалить запись о долге? Деньги НЕ будут списаны.')) return;
    state.debts = state.debts.filter(function (x) { return x.id !== id; });
    saveState();
    renderDebts(document.getElementById('mainContent'));
}

/* =========================================================================
   TAB: PLANS
   ========================================================================= */
function renderPlans(c) {
    var html =
        '<div class="card">' +
            '<div class="card-header">' +
                '<div class="card-title">Планы на покупки</div>' +
                '<button type="button" class="btn-icon" data-action="add-plan" aria-label="Добавить цель">+</button>' +
            '</div>';

    if (state.plans.length === 0) {
        html += '<div class="empty-state">Нет запланированных покупок</div>';
    } else {
        for (var i = 0; i < state.plans.length; i++) {
            var p = state.plans[i];
            var pct = Math.min(100, Math.round((p.current / p.target) * 100));
            var isFirst = i === 0;
            var isLast = i === state.plans.length - 1;

            html +=
                '<div class="list-item" style="flex-wrap:wrap;">' +
                    '<div class="item-left" style="width:100%">' +
                        '<div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">' +
                            '<div class="item-name">' + esc(p.name) + '</div>' +
                            '<div class="item-amount" style="color:var(--green); font-size:13px; white-space:nowrap;">' +
                                fmt(p.current) + ' / ' + fmt(p.target) +
                            '</div>' +
                        '</div>' +
                        '<div class="progress-bg"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
                        '<div class="item-sub">Создано: ' + formatDate(p.createdAt) + '</div>' +
                        '<div class="item-actions">' +
                            '<button type="button" class="mini-btn move" data-action="move-plan" data-id="' + esc(p.id) + '" data-dir="-1"' +
                                (isFirst ? ' disabled' : '') + ' aria-label="Выше">▲</button>' +
                            '<button type="button" class="mini-btn move" data-action="move-plan" data-id="' + esc(p.id) + '" data-dir="1"' +
                                (isLast ? ' disabled' : '') + ' aria-label="Ниже">▼</button>' +
                            '<button type="button" class="mini-btn pay" data-action="fund-plan" data-id="' + esc(p.id) + '">+ Вложить</button>' +
                            '<button type="button" class="mini-btn edit" data-action="edit-plan" data-id="' + esc(p.id) + '" aria-label="Изменить">✏️</button>' +
                            '<button type="button" class="mini-btn del" data-action="del-plan" data-id="' + esc(p.id) + '" aria-label="Удалить">✕</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
        }
    }

    html += '</div>';
    c.innerHTML = html;
}

function movePlan(id, dir) {
    var idx = -1;
    for (var i = 0; i < state.plans.length; i++) {
        if (state.plans[i].id === id) { idx = i; break; }
    }
    if (idx === -1) return;
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= state.plans.length) return;

    var tmp = state.plans[idx];
    state.plans[idx] = state.plans[newIdx];
    state.plans[newIdx] = tmp;

    saveState();
    renderPlans(document.getElementById('mainContent'));
}

function showAddPlan(existingId) {
    var p = (existingId != null) ? state.plans.filter(function (x) { return x.id === existingId; })[0] : null;
    showModal(
        '<h3>' + (p ? 'Изменить цель' : 'Новая цель') + '</h3>' +
        '<input type="text" id="planName" placeholder="На что копим" autocomplete="off" value="' + esc(p ? p.name : '') + '">' +
        '<input type="text" id="planTarget" placeholder="Нужная сумма" inputmode="decimal" autocomplete="off" value="' + (p ? p.target : '') + '">' +
        '<button type="button" class="btn-full btn-primary" data-action="save-plan" data-id="' + (existingId != null ? esc(existingId) : '') + '">' +
            (p ? 'Сохранить' : 'Создать') +
        '</button>' +
        '<button type="button" class="btn-full btn-outline" data-action="close-modal">Отмена</button>'
    );
}

function savePlan(id) {
    var nameEl = document.getElementById('planName');
    var targetEl = document.getElementById('planTarget');
    var name = nameEl ? nameEl.value.trim() : '';
    var target = targetEl ? parseAmount(targetEl.value) : null;
    if (!name || target === null) return;

    if (id) {
        var found = null;
        for (var i = 0; i < state.plans.length; i++) {
            if (state.plans[i].id === id) { found = state.plans[i]; break; }
        }
        if (found) { found.name = name; found.target = target; }
    } else {
        state.plans.push({
            id: uid(),
            name: name,
            target: target,
            current: 0,
            createdAt: new Date().toISOString()
        });
    }

    saveState();
    hideModal();
    renderPlans(document.getElementById('mainContent'));
}

function showFundPlan(id) {
    var p = null;
    for (var i = 0; i < state.plans.length; i++) {
        if (state.plans[i].id === id) { p = state.plans[i]; break; }
    }
    if (!p) return;

    var remain = Math.max(0, p.target - p.current);
    showModal(
        '<h3>Вложить в «' + esc(p.name) + '»</h3>' +
        '<div style="font-size:12px; color:var(--dim); margin-bottom:10px; line-height:1.5;">' +
            'Осталось накопить: <b style="color:var(--green)">' + fmt(remain) + '</b><br>' +
            'Доступно на балансе: <b style="color:var(--blue)">' + fmt(state.balance) + '</b>' +
        '</div>' +
        '<input type="text" id="fundAmount" placeholder="Сумма вклада" inputmode="decimal" autocomplete="off">' +
        '<button type="button" class="btn-full btn-primary" data-action="save-fund" data-id="' + esc(p.id) + '">Вложить</button>' +
        '<button type="button" class="btn-full btn-outline" data-action="close-modal">Отмена</button>'
    );
}

function fundPlan(id) {
    var p = null;
    for (var i = 0; i < state.plans.length; i++) {
        if (state.plans[i].id === id) { p = state.plans[i]; break; }
    }
    if (!p) return;

    var input = document.getElementById('fundAmount');
    var amt = input ? parseAmount(input.value) : null;
    if (amt === null) {
        if (input) { try { input.focus(); } catch (_) {} }
        return;
    }

    if (amt > state.balance) {
        alert('Недостаточно средств.\nНужно: ' + fmt(amt) + '\nДоступно: ' + fmt(state.balance));
        return;
    }

    state.balance -= amt;
    p.current += amt;
    state.history.unshift({
        date: new Date().toISOString(),
        type: TYPE.TRANSFER,
        desc: 'Вклад в цель: ' + p.name,
        amount: -amt
    });

    saveState();
    hideModal();
    renderPlans(document.getElementById('mainContent'));
}

function editPlan(id) { showAddPlan(id); }

function delPlan(id) {
    var p = null;
    for (var i = 0; i < state.plans.length; i++) {
        if (state.plans[i].id === id) { p = state.plans[i]; break; }
    }
    if (!p) return;

    if (!confirm('Удалить цель "' + p.name + '"?\nНакопленные ' + fmt(p.current) + ' вернутся на баланс.')) return;

    var refund = p.current;
    state.balance += refund;
    if (refund > 0) {
        state.history.unshift({
            date: new Date().toISOString(),
            type: TYPE.TRANSFER,
            desc: 'Отмена цели: ' + p.name + ' (возврат)',
            amount: refund
        });
    }
    state.plans = state.plans.filter(function (x) { return x.id !== id; });

    saveState();
    renderPlans(document.getElementById('mainContent'));
}

/* =========================================================================
   TAB: SETTINGS
   ========================================================================= */
function renderSettings(c) {
    c.innerHTML =
        '<div class="card">' +
            '<div class="card-title" style="margin-bottom:15px">Управление данными</div>' +
            '<p style="font-size:13px; color:var(--dim); margin:0 0 15px; line-height:1.5;">' +
                'Все данные хранятся только на этом устройстве. Регулярно делай резервные копии.' +
            '</p>' +
            '<button type="button" class="btn-full btn-primary" data-action="export">💾 Экспорт (Скачать JSON)</button>' +
            '<button type="button" class="btn-full btn-outline" data-action="import">📥 Импорт (Загрузить JSON)</button>' +
            '<input type="file" id="importFile" accept=".json,application/json">' +
            '<div style="margin-top:20px; border-top:1px solid var(--border); padding-top:15px;">' +
                '<div class="card-title" style="margin-bottom:10px">Сброс данных</div>' +
                '<button type="button" class="btn-full btn-danger" data-action="reset">Удалить все данные</button>' +
            '</div>' +
        '</div>' +
        '<div class="card">' +
            '<div class="card-title">О приложении</div>' +
            '<p style="font-size:12px; color:var(--dim); line-height:1.5; margin:8px 0 0;">' +
                'Finance Shield<br>' +
                'Локальное хранилище. Без серверов. Без рекламы.<br>' +
                'Данные никогда не покидают твоё устройство.' +
            '</p>' +
        '</div>';
}

function exportData() {
    var json = JSON.stringify(state, null, 2);
    var filename = 'finance_backup_' + new Date().toISOString().slice(0, 10) + '.json';

    try {
        var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { try { URL.revokeObjectURL(url); } catch (_) {} }, 1500);
        return;
    } catch (e) {
        console.warn('[FinanceShield] Blob export failed, using data URI', e);
    }

    try {
        var dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(json);
        var a2 = document.createElement('a');
        a2.href = dataUri;
        a2.download = filename;
        document.body.appendChild(a2);
        a2.click();
        document.body.removeChild(a2);
    } catch (e2) {
        alert('Экспорт не удался. Скопируй данные вручную из консоли.');
        console.log(json);
    }
}

function importData() {
    var input = document.getElementById('importFile');
    if (!input || !input.files || !input.files[0]) return;

    var file = input.files[0];
    var reader = new FileReader();

    reader.onload = function (e) {
        try {
            var imported = JSON.parse(e.target.result);
            if (!imported || typeof imported !== 'object' || imported.balance === undefined) {
                alert('Ошибка: неверный формат файла.');
                return;
            }
            if (!confirm('Это заменит ВСЕ текущие данные. Продолжить?')) return;

            state = migrate(imported);
            saveState();
            switchTab('balance');
            alert('Данные успешно восстановлены!');
        } catch (err) {
            alert('Ошибка чтения файла: ' + err.message);
        }
    };
    reader.onerror = function () { alert('Не удалось прочитать файл.'); };
    reader.readAsText(file);

    try { input.value = ''; } catch (_) {}
}

function resetAll() {
    if (!confirm('ВНИМАНИЕ: Это удалит ВСЕ данные безвозвратно. Ты уверен?')) return;
    if (!confirm('Точно? Последнее предупреждение?')) return;

    state = emptyState();
    saveState();
    switchTab('balance');
}

/* =========================================================================
   MODAL
   ========================================================================= */
var modalVisible = false;

function showModal(html) {
    var content = document.getElementById('modalContent');
    var overlay = document.getElementById('modalOverlay');
    content.innerHTML = html;
    overlay.classList.add('visible');
    modalVisible = true;

    requestAnimationFrame(function () {
        var inp = content.querySelector('input:not([type=file])');
        if (inp) { try { inp.focus(); } catch (_) {} }
    });
}

function hideModal() {
    var overlay = document.getElementById('modalOverlay');
    var content = document.getElementById('modalContent');
    overlay.classList.remove('visible');
    content.innerHTML = '';
    modalVisible = false;
}

/* =========================================================================
   ДЕЛЕГИРОВАНИЕ СОБЫТИЙ
   ========================================================================= */
var ACTIONS = {
    'op':          function (el) { doOp(Number(el.getAttribute('data-sign'))); },
    'filter':      function (el) { setHistoryFilter(el.getAttribute('data-filter')); },

    'add-debt':    function ()   { showAddDebt(); },
    'edit-debt':   function (el) { editDebt(el.getAttribute('data-id')); },
    'save-debt':   function (el) { var id = el.getAttribute('data-id'); saveDebt(id || null); },
    'pay-debt':    function (el) { payDebt(el.getAttribute('data-id')); },
    'del-debt':    function (el) { delDebt(el.getAttribute('data-id')); },

    'add-plan':    function ()   { showAddPlan(); },
    'edit-plan':   function (el) { editPlan(el.getAttribute('data-id')); },
    'save-plan':   function (el) { var id = el.getAttribute('data-id'); savePlan(id || null); },
    'move-plan':   function (el) { movePlan(el.getAttribute('data-id'), Number(el.getAttribute('data-dir'))); },
    'fund-plan':   function (el) { showFundPlan(el.getAttribute('data-id')); },
    'save-fund':   function (el) { fundPlan(el.getAttribute('data-id')); },
    'del-plan':    function (el) { delPlan(el.getAttribute('data-id')); },

    'export':      function ()   { exportData(); },
    'import':      function ()   { var i = document.getElementById('importFile'); if (i) i.click(); },
    'reset':       function ()   { resetAll(); },
    'close-modal': function ()   { hideModal(); }
};

function handleClick(e) {
    var t = e.target;
    if (!t || typeof t.closest !== 'function') return;
    var el = t.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var fn = ACTIONS[action];
    if (fn) fn(el);
}

function bindEvents() {
    document.getElementById('navTabs').addEventListener('click', function (e) {
        var t = e.target;
        if (!t || typeof t.closest !== 'function') return;
        var btn = t.closest('.tab-btn');
        if (btn) switchTab(btn.getAttribute('data-tab'));
    });

    document.getElementById('filtersBar').addEventListener('click', handleClick);
    document.getElementById('mainContent').addEventListener('click', handleClick);

    document.getElementById('modalOverlay').addEventListener('click', function (e) {
        if (e.target && e.target.id === 'modalOverlay') { hideModal(); return; }
        handleClick(e);
    });

    document.body.addEventListener('change', function (e) {
        if (e.target && e.target.id === 'importFile') importData();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modalVisible) hideModal();
    });
}

/* =========================================================================
   INIT
   ========================================================================= */
function init() {
    try {
        loadState();
        renderHeader();
        bindEvents();
        switchTab('balance');
    } catch (e) {
        var screen = document.getElementById('errScreen');
        screen.textContent = 'INIT ERROR:\n' + (e && e.stack ? e.stack : String(e));
        screen.style.display = 'block';
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
