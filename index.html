<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f1115">
    <title>Finance Shield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="stat-box balance-box">
        <div class="stat-label">Полный остаток</div>
        <div class="stat-value" id="totalBalance" data-value="0">0 ₽</div>
    </div>
    <div class="stat-box debt-box">
        <div class="stat-label">Мои долги</div>
        <div class="stat-value" id="totalDebt" data-value="0">0 ₽</div>
    </div>
    <div class="stat-box plans-box">
        <div class="stat-label">Планы (цели)</div>
        <div class="stat-value" id="totalPlans" data-value="0">0 ₽</div>
    </div>
</header>

<nav class="nav-tabs" id="navTabs">
    <button class="tab-btn active" data-tab="balance">Остаток</button>
    <button class="tab-btn" data-tab="debts">Долги</button>
    <button class="tab-btn" data-tab="plans">Планы</button>
    <button class="tab-btn" data-tab="shopping">🛒</button>
    <button class="tab-btn" data-tab="analytics">📊</button>
    <button class="tab-btn" data-tab="settings">⚙️</button>
</nav>

<div class="swipe-container" id="mainContent">
    <div class="tab-pane active" id="pane-balance"></div>
    <div class="tab-pane" id="pane-debts"></div>
    <div class="tab-pane" id="pane-plans"></div>
    <div class="tab-pane" id="pane-shopping"></div>
    <div class="tab-pane" id="pane-analytics"></div>
    <div class="tab-pane" id="pane-settings"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
</div>

<div id="errScreen"></div>

<script src="script.js"></script>
</body>
</html>
