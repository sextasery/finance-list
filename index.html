<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1115">
<meta name="format-detection" content="telephone=no">
<title>Finance Shield</title>
<style>
    :root {
        --bg: #0f1115;
        --card: #1a1d24;
        --text: #e0e6ed;
        --dim: #9aa9c0;
        --green: #00d26a;
        --red: #ff4757;
        --blue: #00d2ff;
        --border: #2a3548;
        --min-touch: 44px;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bot: env(safe-area-inset-bottom, 0px);
        --cat-food: #ff9f43;
        --cat-fun: #a55eea;
        --cat-other: #778ca3;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0; padding: 0;
        height: 100vh;
        height: 100dvh;
        display: flex; flex-direction: column;
        overflow: hidden;
        -webkit-user-select: none; user-select: none;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
    }

    @supports not (height: 100dvh) { body { height: 100vh; } }

    :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
        border-radius: 4px;
    }

    header {
        padding: 14px 15px;
        background: linear-gradient(180deg, rgba(26,29,36,1) 0%, rgba(15,17,21,0) 100%);
        border-bottom: 1px solid var(--border);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        flex-shrink: 0;
    }
    .stat-box {
        background: var(--card);
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        min-width: 0;
    }
    .stat-label {
        font-size: 10px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }
    .stat-value {
        font-size: 20px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .balance-box { grid-column: span 2; border-color: var(--blue); }
    .balance-box .stat-value { color: var(--blue); font-size: 28px; }
    .debt-box .stat-value { color: var(--red); }
    .plans-box .stat-value { color: var(--green); }

    .nav-tabs {
        display: flex;
        padding: 0 8px;
        gap: 4px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        flex-shrink: 0;
    }
    .tab-btn {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--dim);
        padding: 14px 0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        min-height: var(--min-touch);
        font-family: inherit;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }

    .filters-bar {
        display: none;
        padding: 10px 15px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
    }
    .filters-bar.visible { display: block; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 0; }
    .filter-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
        height: var(--min-touch);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border-radius: 22px;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        flex-shrink: 0;
        font-family: inherit;
        line-height: 1;
    }
    .filter-btn.active {
        background: var(--blue);
        color: #000;
        border-color: var(--blue);
        font-weight: bold;
    }

    .content {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        -webkit-overflow-scrolling: touch;
    }
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 15px;
    }
    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
    .card-title { font-size: 14px; font-weight: 600; color: var(--dim); }

    .btn-icon {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
        width: var(--min-touch);
        height: var(--min-touch);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 20px;
        padding: 0;
        font-family: inherit;
    }


    /* LISTS — фикс выравнивания: суммы не съезжают, комментарий обрезается */
    .list-item {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 12px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        gap: 10px;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item.tappable {
        cursor: pointer;
        border-radius: 8px;
        padding: 12px 8px;
        margin: 0 -8px;
        transition: background 0.15s;
    }
    .list-item.tappable:active { background: rgba(0,210,255,0.06); }

    .item-left {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
    }
    .item-name {
        font-size: 15px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
    }
    .item-name .item-desc {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        flex: 0 1 auto;
    }
    .item-sub {
        font-size: 11px;
        color: var(--dim);
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .item-right {
        text-align: right;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        min-width: 80px;
    }
    .item-amount {
        font-weight: bold;
        font-size: 15px;
        white-space: nowrap;
        line-height: 1.2;
    }
    .item-actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        flex-wrap: wrap;
    }

    .mini-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
        font-size: 13px;
        padding: 0 12px;
        border-radius: 6px;
        cursor: pointer;
        min-height: var(--min-touch);
        min-width: var(--min-touch);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        line-height: 1;
    }
    .mini-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .mini-btn.pay  { border-color: var(--green); color: var(--green); }
    .mini-btn.edit { border-color: var(--blue);  color: var(--blue); }
    .mini-btn.del  { border-color: var(--red);   color: var(--red); }
    .mini-btn.move { border-color: var(--dim);   color: var(--dim); }

    .history-del-btn {
        background: transparent;
        border: 1px solid transparent;
        color: var(--dim);
        width: 32px; height: 32px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        flex-shrink: 0;
        line-height: 1;
        transition: border-color 0.15s, color 0.15s;
    }
    .history-del-btn:active { border-color: var(--red); color: var(--red); }

    .cat-badge {
        display: inline-block;
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        vertical-align: middle;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
    }
    .cat-badge.food         { background: rgba(255,159,67,0.18); color: #ff9f43; }
    .cat-badge.things       { background: rgba(255,107,157,0.18); color: #ff6b9d; }
    .cat-badge.housing      { background: rgba(38,222,129,0.18);  color: #26de81; }
    .cat-badge.transport    { background: rgba(69,170,242,0.18);  color: #45aaf2; }
    .cat-badge.alcohol      { background: rgba(247,183,49,0.18);  color: #f7b731; }
    .cat-badge.weed         { background: rgba(32,191,107,0.18);  color: #20bf6b; }
    .cat-badge.gaba         { background: rgba(184,165,94,0.18);  color: #b8a55e; }
    .cat-badge.synth        { background: rgba(91,141,255,0.20);  color: #5b8dff; }
    .cat-badge.tariffs      { background: rgba(165,94,234,0.18);  color: #a55eea; }
    .cat-badge.other        { background: rgba(119,140,163,0.18); color: #778ca3; }
    .cat-badge.salary       { background: rgba(0,210,106,0.18); color: #00d26a; }
    .cat-badge.grandma      { background: rgba(74,222,128,0.18); color: #4ade80; }
    .cat-badge.other-income { background: rgba(134,239,172,0.18); color: #86efac; }

    input {
        width: 100%;
        background: #0a0c10;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 10px;
        outline: none;
        font-family: inherit;
        -webkit-user-select: text;
        user-select: text;
    }
    input:focus { border-color: var(--blue); }
    input[type="file"] { display: none; }

    .date-selects {
        display: grid;
        grid-template-columns: 1fr 1.4fr 1.1fr;
        gap: 8px;
        margin-bottom: 10px;
    }
    .date-selects select {
        width: 100%;
        background: #0a0c10;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px 26px 12px 8px;
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath fill='%238b9bb4' d='M0 0l5 6 5-6z'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 10px center;
        cursor: pointer;
    }
    .date-selects select:focus { border-color: var(--blue); }

    .field-label {
        display: block;
        font-size: 11px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 4px;
        margin-top: 4px;
    }

    .btn-full {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
        min-height: var(--min-touch);
        font-family: inherit;
    }
    .btn-primary { background: var(--blue); color: #000; }
    .btn-danger  { background: var(--red);  color: #fff; }
    .btn-outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
        margin-top: 8px;
    }
    .btn-secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
    }

    .empty-state {
        text-align: center;
        color: var(--dim);
        padding: 30px 0;
        font-size: 13px;
        line-height: 1.5;
    }
    .progress-bg {
        height: 4px;
        background: #333;
        border-radius: 2px;
        margin: 8px 0;
        overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--green); }

    .summary-box {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.05);
        font-size: 12px;
        color: var(--dim);
        flex-wrap: wrap;
        gap: 6px;
    }
    .summary-val { font-weight: bold; font-size: 14px; }

    #errScreen {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #1a0a0a;
        color: #ff8888;
        padding: 20px;
        font: 12px/1.5 monospace;
        white-space: pre-wrap;
        overflow: auto;
        z-index: 9999;
        -webkit-user-select: text;
        user-select: text;
    }


    /* MODAL — фикс скролла: скроллится overlay, а не modal.
       Модалка выравнивается по верху, чтобы клавиатура не перекрывала кнопки. */
    .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    z-index: 100;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 20px;
    padding-bottom: 120px;
}
.modal-overlay.visible { display: block; }
.modal {
    background: var(--card);
    width: 100%;
    max-width: 400px;
    padding: 20px;
    border-radius: 16px;
    border: 1px solid var(--border);
    margin: 0 auto;
}
    .modal h3 { margin: 0 0 15px 0; color: var(--text); font-size: 18px; }

    .modal .confirm-text {
        font-size: 14px;
        line-height: 1.5;
        color: var(--text);
        margin: 0 0 16px 0;
    }
    .modal .confirm-hint {
        font-size: 11px;
        color: var(--dim);
        margin-top: 8px;
        text-align: center;
    }
    .modal .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 5px;
    }
    .modal .btn-row .btn-full { margin-top: 0; }

    .modal .debt-info {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 14px;
        font-size: 12px;
        line-height: 1.6;
        color: var(--dim);
    }
    .modal .debt-info b { color: var(--text); font-weight: bold; }
    .modal .debt-info .remain { color: var(--red); }
    .modal .debt-info .available { color: var(--blue); }

    .modal .quick-amounts {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }
    .modal .quick-amounts button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        min-height: 36px;
    }

    .modal .history-summary {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 14px;
    }
    .modal .history-summary .h-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 4px;
        word-break: break-word;
    }
    .modal .history-summary .h-meta {
        font-size: 12px;
        color: var(--dim);
    }
    .modal .history-summary .h-amount {
        font-size: 15px;
        font-weight: bold;
        margin-top: 6px;
    }
    .modal .history-summary .h-amount.pos { color: var(--green); }
    .modal .history-summary .h-amount.neg { color: var(--red); }

    .modal .checkbox-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 12px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
        cursor: pointer;
        user-select: none;
        min-height: var(--min-touch);
    }
    .modal .checkbox-row.disabled { opacity: 0.4; cursor: not-allowed; }
    .modal .checkbox-row input[type="checkbox"] {
        width: 20px; height: 20px;
        margin: 0; margin-top: 1px;
        flex-shrink: 0;
        accent-color: var(--blue);
        cursor: pointer;
    }
    .modal .checkbox-row.disabled input[type="checkbox"] { cursor: not-allowed; }
    .modal .checkbox-row .cb-label {
        flex: 1 1 auto;
        font-size: 14px;
        color: var(--text);
        line-height: 1.4;
    }
    .modal .checkbox-row .cb-hint {
        display: block;
        font-size: 11px;
        color: var(--dim);
        margin-top: 3px;
        line-height: 1.4;
    }

    .modal .cat-amount {
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 6px;
        color: var(--red);
    }
    .modal .cat-desc {
        font-size: 13px;
        color: var(--dim);
        text-align: center;
        margin-bottom: 20px;
        word-break: break-word;
    }
    .modal .cat-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
    }
    .modal .cat-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
        min-height: var(--min-touch);
        text-align: left;
        width: 100%;
    }
    .modal .cat-btn .cat-icon { font-size: 22px; flex-shrink: 0; }
    .modal .cat-btn.active {
        border-color: var(--blue);
        background: rgba(0,210,255,0.08);
    }

    /* ANALYTICS */
    .tf-switcher { display: flex; gap: 4px; margin-bottom: 12px; }
    .tf-btn {
        flex: 1;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
        padding: 10px 0;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        min-height: 40px;
        letter-spacing: 0.3px;
    }
    .tf-btn.active {
        background: var(--blue);
        color: #000;
        border-color: var(--blue);
    }

    .chart-wrap { position: relative; width: 100%; margin-bottom: 12px; }
    .chart-canvas {
        width: 100%;
        height: 320px;
        display: block;
        background: #0a0c10;
        border: 1px solid var(--border);
        border-radius: 8px;
        touch-action: manipulation;
    }

    .chart-tooltip {
        position: fixed;
        background: rgba(20, 23, 30, 0.97);
        border: 1px solid var(--blue);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12px;
        color: var(--text);
        pointer-events: none;
        z-index: 200;
        max-width: 260px;
        line-height: 1.5;
        box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .chart-tooltip .tt-period {
        font-weight: bold;
        font-size: 13px;
        margin-bottom: 6px;
        color: var(--blue);
    }
    .chart-tooltip .tt-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 2px;
    }
    .chart-tooltip .tt-row .tt-label { color: var(--dim); }
    .chart-tooltip .tt-row .tt-value { font-weight: bold; }
    .chart-tooltip .tt-row .tt-value.pos { color: var(--green); }
    .chart-tooltip .tt-row .tt-value.neg { color: var(--red); }
    .chart-tooltip .tt-sep {
        border-top: 1px solid var(--border);
        margin: 6px 0;
    }
    .chart-tooltip .tt-cat-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 2px;
        font-size: 11px;
    }

    .analytics-summary {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
        margin-top: 12px;
    }
    .analytics-summary .as-row {
        display: flex;
        justify-content: space-between;
        color: var(--dim);
    }
    .analytics-summary .as-row b { color: var(--text); font-weight: bold; }
    .analytics-summary .as-row b.pos { color: var(--green); }
    .analytics-summary .as-row b.neg { color: var(--red); }

    .cat-table {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
    }
    .cat-table-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
    }
    .cat-table-row .ct-dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
    }
    .cat-table-row .ct-name { flex: 1 1 auto; color: var(--text); }
    .cat-table-row .ct-amount { color: var(--text); font-weight: bold; }
    .cat-table-row .ct-pct {
        color: var(--dim);
        font-size: 11px;
        min-width: 42px;
        text-align: right;
    }
</style>
</head>
<body>

<div id="errScreen"></div>

<header>
    <div class="stat-box balance-box">
        <div class="stat-label">Полный остаток</div>
        <div class="stat-value" id="totalBalance">0 ₽</div>
    </div>
    <div class="stat-box debt-box">
        <div class="stat-label">Мои долги</div>
        <div class="stat-value" id="totalDebt">0 ₽</div>
    </div>
    <div class="stat-box plans-box">
        <div class="stat-label">Планы (цели)</div>
        <div class="stat-value" id="totalPlans">0 ₽</div>
    </div>
</header>

<div class="nav-tabs" id="navTabs">
    <button class="tab-btn active" data-tab="balance" type="button">Остаток</button>
    <button class="tab-btn" data-tab="debts" type="button">Долги</button>
    <button class="tab-btn" data-tab="plans" type="button">Планы</button>
    <button class="tab-btn" data-tab="analytics" type="button">📊</button>
    <button class="tab-btn" data-tab="settings" type="button">⚙️</button>
</div>

<div class="filters-bar" id="filtersBar"></div>

<div class="content" id="mainContent"></div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
</div>

<div class="chart-tooltip" id="chartTooltip" style="display:none;"></div>

<script>
'use strict';
// === ЧАСТЬ 3 ЗАКОНЧЕНА ===

/* =========================================================================
   ГЛОБАЛЬНЫЙ ПЕРЕХВАТ ОШИБОК
   ========================================================================= */
(function installErrorScreen() {
    var screen = document.getElementById('errScreen');
    var shown = false;
    function show(msg) {
        if (shown) return;
        shown = true;
        screen.textContent = msg;
        screen.style.display = 'block';
    }
    window.addEventListener('error', function (e) {
        var info = 'ERROR: ' + (e.message || 'unknown') + '\n';
        if (e.filename) info += 'at ' + e.filename + ':' + (e.lineno || '?') + ':' + (e.colno || '?') + '\n\n';
        if (e.error && e.error.stack) info += e.error.stack;
        show(info);
    });
    window.addEventListener('unhandledrejection', function (e) {
        show('UNHANDLED PROMISE:\n' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)));
    });
})();

/* =========================================================================
   КОНСТАНТЫ
   ========================================================================= */
var STORAGE_KEY        = 'fin_shield_v8';
var HISTORY_LIMIT      = 5000;
var HISTORY_VIEW_LIMIT = 50;
var STATE_VERSION      = 8;

var TYPE = { INCOME: 'income', EXPENSE: 'expense', TRANSFER: 'transfer' };

var FILTERS = [
    { id: 'all',         label: 'Все'      },
    { id: TYPE.INCOME,   label: 'Доходы'   },
    { id: TYPE.EXPENSE,  label: 'Расходы'  },
    { id: TYPE.TRANSFER, label: 'Переводы' }
];

var DEBT_FULL_PREFIX    = 'Возврат долга: ';
var DEBT_PARTIAL_PREFIX = 'Частичный возврат: ';
var DEBT_PARTIAL_MARKER = ' (остаток ';

var CATEGORIES = [
    { id: 'food',      name: 'Еда',       icon: '🍕', cssClass: 'food',      color: '#ff9f43' },
    { id: 'things',    name: 'Вещи',      icon: '👕', cssClass: 'things',    color: '#ff6b9d' },
    { id: 'housing',   name: 'Жильё',     icon: '🏠', cssClass: 'housing',   color: '#26de81' },
    { id: 'transport', name: 'Проезд',    icon: '🚌', cssClass: 'transport', color: '#45aaf2' },
    { id: 'alcohol',   name: 'Алкоголь',  icon: '🍷', cssClass: 'alcohol',   color: '#f7b731' },
    { id: 'weed',      name: 'Трава',     icon: '🌿', cssClass: 'weed',      color: '#20bf6b' },
    { id: 'gaba',      name: 'Габа',      icon: '💊', cssClass: 'gaba',      color: '#b8a55e' },
    { id: 'synth',     name: 'Синтетика', icon: '❄️', cssClass: 'synth',     color: '#5b8dff' },
    { id: 'tariffs',   name: 'Тарифы',    icon: '📱', cssClass: 'tariffs',   color: '#a55eea' },
    { id: 'other',     name: 'Прочее',    icon: '💸', cssClass: 'other',     color: '#778ca3' }
];

var CATEGORIES_INCOME = [
    { id: 'salary',       name: 'Зарплата', icon: '💰', cssClass: 'salary',       color: '#00d26a' },
    { id: 'grandma',      name: 'Бабушка',  icon: '👵', cssClass: 'grandma',      color: '#4ade80' },
    { id: 'other-income', name: 'Прочее',   icon: '💵', cssClass: 'other-income', color: '#86efac' }
];

var DEFAULT_CATEGORY_ID        = 'other';
var DEFAULT_INCOME_CATEGORY_ID = 'other-income';

var TIMEFRAMES = [
    { id: 'D1', label: 'D1', days: 30,   unit: 'day'   },
    { id: 'W1', label: 'W1', days: 84,   unit: 'week'  },
    { id: 'M1', label: 'M1', days: 365,  unit: 'month' },
    { id: 'M3', label: 'M3', days: 730,  unit: 'q'     },
    { id: 'Y1', label: 'Y1', days: 1826, unit: 'year'  }
];

var MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
var MONTHS_FULL  = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                    'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

/* =========================================================================
   УТИЛИТЫ — базовые
   ========================================================================= */
var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) { return ESC_MAP[c]; });
}

function fmt(num) {
    var n = (typeof num === 'number' && isFinite(num)) ? Math.round(num) : 0;
    try { return n.toLocaleString('ru-RU') + ' ₽'; }
    catch (_) { return n + ' ₽'; }
}

function fmtShort(num) {
    var n = Math.round(num);
    var abs = Math.abs(n);
    if (abs >= 1000000) return (n / 1000000).toFixed(1) + 'М';
    if (abs >= 1000)    return (n / 1000).toFixed(1) + 'К';
    return String(n);
}

function uid() {
    try {
        if (typeof crypto !== 'undefined' && crypto && typeof crypto.randomUUID === 'function') {
            return crypto.randomUUID();
        }
    } catch (_) {}
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function parseAmount(raw) {
    if (raw === null || raw === undefined) return null;
    var s = String(raw).replace(/\s/g, '').replace(',', '.').trim();
    if (!s) return null;
    var n = Number(s);
    return (isFinite(n) && n > 0) ? n : null;
}

/* =========================================================================
   УТИЛИТЫ — даты
   ========================================================================= */
function pad2(n) { return n < 10 ? '0' + n : String(n); }

function dateToParts(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) d = new Date();
    return {
        day: d.getDate(),
        month: d.getMonth() + 1,
        year: d.getFullYear()
    };
}

function partsToDate(day, month, year) {
    var dd = parseInt(day, 10);
    var mm = parseInt(month, 10);
    var yy = parseInt(year, 10);
    if (!dd || !mm || !yy) return new Date();
    return new Date(yy, mm - 1, dd, 12, 0, 0);
}

function partsToIso(day, month, year, sourceIso) {
    var src = sourceIso ? new Date(sourceIso) : new Date();
    if (isNaN(src.getTime())) src = new Date();
    var hh = src.getHours();
    var mi = src.getMinutes();
    var ss = src.getSeconds();
    var d = new Date(parseInt(year, 10), parseInt(month, 10) - 1, parseInt(day, 10), hh, mi, ss);
    return d.toISOString();
}

function getYearRange() {
    var now = new Date().getFullYear();
    var arr = [];
    for (var y = now - 5; y <= now + 1; y++) arr.push(y);
    return arr;
}

function daysInMonth(month, year) {
    return new Date(parseInt(year, 10), parseInt(month, 10), 0).getDate();
}

function formatDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    try {
        return d.toLocaleDateString('ru-RU') + ' ' +
            d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    } catch (_) { return d.toString(); }
}

function formatDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    try { return d.toLocaleDateString('ru-RU'); }
    catch (_) { return d.toDateString(); }
}

/* =========================================================================
   УТИЛИТЫ — категории и распознавание
   ========================================================================= */
function getCategory(catId) {
    for (var i = 0; i < CATEGORIES.length; i++) {
        if (CATEGORIES[i].id === catId) return CATEGORIES[i];
    }
    return null;
}

function getIncomeCategory(catId) {
    for (var i = 0; i < CATEGORIES_INCOME.length; i++) {
        if (CATEGORIES_INCOME[i].id === catId) return CATEGORIES_INCOME[i];
    }
    return null;
}

function getCategoryAny(catId) {
    return getCategory(catId) || getIncomeCategory(catId);
}

function getCategoriesByType(type) {
    return (type === TYPE.INCOME) ? CATEGORIES_INCOME : CATEGORIES;
}

function parseDebtReturn(desc) {
    if (typeof desc !== 'string') return null;

    if (desc.indexOf(DEBT_FULL_PREFIX) === 0) {
        var fullName = desc.slice(DEBT_FULL_PREFIX.length);
        if (!fullName) return null;
        return { kind: 'full', to: fullName };
    }

    if (desc.indexOf(DEBT_PARTIAL_PREFIX) === 0) {
        var rest = desc.slice(DEBT_PARTIAL_PREFIX.length);
        var parenIdx = rest.indexOf(DEBT_PARTIAL_MARKER);
        var partName = (parenIdx > 0) ? rest.slice(0, parenIdx) : rest;
        if (!partName) return null;
        return { kind: 'partial', to: partName };
    }

    return null;
}

// === ЧАСТЬ 4 ЗАКОНЧЕНА ===

/* =========================================================================
   СОСТОЯНИЕ
   ========================================================================= */
function emptyState() {
    return {
        version: STATE_VERSION,
        balance: 0,
        debts: [],
        plans: [],
        history: [],
        tf: 'D1'
    };
}

var state = emptyState();
var currentTab = 'balance';
var historyFilter = 'all';

/* =========================================================================
   PERSISTENCE
   ========================================================================= */
var storageAvailable = true;
try {
    var _t = '__fs_test__';
    window.localStorage.setItem(_t, '1');
    window.localStorage.removeItem(_t);
} catch (e) {
    storageAvailable = false;
}

function loadState() {
    if (!storageAvailable) return;
    try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) {
            var old = window.localStorage.getItem('fin_shield_v7');
            if (old) {
                raw = old;
                console.log('[FinanceShield] migrated from v7 storage');
            }
        }
        if (!raw) return;
        var parsed = JSON.parse(raw);
        state = migrate(parsed);
    } catch (e) {
        console.error('[FinanceShield] load error:', e);
        state = emptyState();
    }
}

function migrate(raw) {
    if (!raw || typeof raw !== 'object') return emptyState();
    var s = emptyState();
    s.balance = (typeof raw.balance === 'number' && isFinite(raw.balance)) ? raw.balance : 0;
    s.debts   = Array.isArray(raw.debts)   ? raw.debts.filter(isValidDebt)      : [];
    s.plans   = Array.isArray(raw.plans)   ? raw.plans.filter(isValidPlan)      : [];
    s.history = Array.isArray(raw.history) ? raw.history.filter(isValidHistory) : [];
    s.tf      = isValidTf(raw.tf) ? raw.tf : 'D1';

    for (var i = 0; i < s.history.length; i++) {
    var h = s.history[i];
    if (!h.id) h.id = uid();
    // Переезд со старой категории "fun" (Развлечения) в "other" (Прочее)
    if (h.categoryId === 'fun') h.categoryId = 'other';
    if (h.type === TYPE.EXPENSE && !h.categoryId) h.categoryId = DEFAULT_CATEGORY_ID;
    if (h.type === TYPE.INCOME  && !h.categoryId) h.categoryId = DEFAULT_INCOME_CATEGORY_ID;
}
return s;
}

function isValidTf(id) {
    for (var i = 0; i < TIMEFRAMES.length; i++) {
        if (TIMEFRAMES[i].id === id) return true;
    }
    return false;
}

function isValidDebt(d) {
    return d && typeof d.to === 'string'
        && typeof d.amount === 'number' && isFinite(d.amount)
        && d.id != null;
}
function isValidPlan(p) {
    return p && typeof p.name === 'string'
        && typeof p.target === 'number' && isFinite(p.target)
        && typeof p.current === 'number' && isFinite(p.current)
        && p.id != null;
}
function isValidHistory(h) {
    return h && typeof h.date === 'string'
        && typeof h.amount === 'number' && isFinite(h.amount);
}

function saveState() {
    if (state.history.length > HISTORY_LIMIT) state.history.length = HISTORY_LIMIT;
    if (!storageAvailable) { renderHeader(); return; }
    try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
        console.error('[FinanceShield] save error:', e);
        if (e && e.name === 'QuotaExceededError') {
            alert('Хранилище переполнено. Сделай экспорт и очисти историю.');
        }
    }
    renderHeader();
}

/* =========================================================================
   ХЕДЕР
   ========================================================================= */
function renderHeader() {
    document.getElementById('totalBalance').textContent = fmt(state.balance);

    var debtSum = 0;
    for (var i = 0; i < state.debts.length; i++) debtSum += state.debts[i].amount;
    document.getElementById('totalDebt').textContent = fmt(debtSum);

    var planSum = 0;
    for (var j = 0; j < state.plans.length; j++) planSum += state.plans[j].current;
    document.getElementById('totalPlans').textContent = fmt(planSum);
}

/* =========================================================================
   TABS
   ========================================================================= */
function switchTab(tab) {
    currentTab = tab;

    var tabs = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].getAttribute('data-tab') === tab) tabs[i].classList.add('active');
        else tabs[i].classList.remove('active');
    }

    if (tab === 'balance') renderFiltersBar();
    else hideFiltersBar();

    var c = document.getElementById('mainContent');
    c.innerHTML = '';

    if (tab === 'balance')        renderBalance(c);
    else if (tab === 'debts')     renderDebts(c);
    else if (tab === 'plans')     renderPlans(c);
    else if (tab === 'analytics') renderAnalytics(c);
    else if (tab === 'settings')  renderSettings(c);

    c.scrollTop = 0;
    hideChartTooltip();
}

/* =========================================================================
   FILTERS BAR
   ========================================================================= */
function renderFiltersBar() {
    var bar = document.getElementById('filtersBar');
    if (!bar) return;
    var html = '<div class="filters">';
    for (var i = 0; i < FILTERS.length; i++) {
        var f = FILTERS[i];
        html += '<button type="button" class="filter-btn ' +
            (historyFilter === f.id ? 'active' : '') +
            '" data-action="filter" data-filter="' + f.id + '">' + f.label + '</button>';
    }
    html += '</div>';
    bar.innerHTML = html;
    bar.classList.add('visible');
}

function hideFiltersBar() {
    var bar = document.getElementById('filtersBar');
    if (bar) { bar.classList.remove('visible'); bar.innerHTML = ''; }
}

/* =========================================================================
   TAB: BALANCE
   ========================================================================= */
function renderBalance(c) {
    var formHtml =
        '<div class="card">' +
            '<div class="card-title" style="margin-bottom:10px">Операция с остатком</div>' +
            '<input type="text" id="opAmount" placeholder="Сумма" inputmode="decimal" autocomplete="off">' +
            '<input type="text" id="opDesc" placeholder="Комментарий" autocomplete="off">' +
            '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">' +
                '<button type="button" class="btn-full btn-primary" data-action="op" data-sign="1">+ Пополнить</button>' +
                '<button type="button" class="btn-full btn-danger"  data-action="op" data-sign="-1">− Списать</button>' +
            '</div>' +
        '</div>';

    var filtered;
    if (historyFilter === 'all') {
        filtered = state.history;
    } else if (historyFilter === TYPE.INCOME) {
        filtered = state.history.filter(function (h) { return h.amount > 0; });
    } else if (historyFilter === TYPE.EXPENSE) {
        filtered = state.history.filter(function (h) { return h.amount < 0; });
    } else if (historyFilter === TYPE.TRANSFER) {
        filtered = state.history.filter(function (h) { return h.type === TYPE.TRANSFER; });
    } else {
        filtered = state.history;
    }

    var historyHtml = '<div class="card"><div class="card-title">История операций</div>';

    if (filtered.length === 0) {
        historyHtml += '<div class="empty-state">Нет записей<br>Начни с пополнения баланса</div>';
    } else {
        var limit = Math.min(filtered.length, HISTORY_VIEW_LIMIT);
        for (var k = 0; k < limit; k++) {
            var h = filtered[k];
            var isPos = h.amount > 0;
            var color = isPos ? 'var(--green)' : 'var(--red)';
            var sign  = isPos ? '+' : '';

            var badgeHtml = '';
            if (h.categoryId) {
                var cat = getCategoryAny(h.categoryId);
                if (cat) {
                    badgeHtml = '<span class="cat-badge ' + cat.cssClass + '">' +
                        cat.icon + ' ' + esc(cat.name) + '</span>';
                }
            }

            historyHtml +=
                '<div class="list-item tappable" data-action="history-edit" data-id="' + esc(h.id) + '">' +
                    '<div class="item-left">' +
                        '<div class="item-name">' +
                            '<span class="item-desc">' + (esc(h.desc) || 'Без описания') + '</span>' +
                            badgeHtml +
                        '</div>' +
                        '<div class="item-sub">' + formatDateTime(h.date) + '</div>' +
                    '</div>' +
                    '<div class="item-right">' +
                        '<div class="item-amount" style="color:' + color + '">' + sign + fmt(h.amount) + '</div>' +
                        '<button type="button" class="history-del-btn" ' +
                            'data-action="history-del" data-id="' + esc(h.id) + '" ' +
                            'aria-label="Удалить запись">✕</button>' +
                    '</div>' +
                '</div>';
        }
    }

    var now = new Date();
    var startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    var income = 0, expense = 0;
    for (var m = 0; m < state.history.length; m++) {
        var rec = state.history[m];
        var d = new Date(rec.date);
        if (isNaN(d.getTime()) || d < startOfMonth) continue;
        if (rec.type === TYPE.INCOME) income += rec.amount;
        else if (rec.type === TYPE.EXPENSE) expense += Math.abs(rec.amount);
    }

    historyHtml +=
        '<div class="summary-box">' +
            '<span>Доходы: <span class="summary-val" style="color:var(--green)">' + fmt(income) + '</span></span>' +
            '<span>Расходы: <span class="summary-val" style="color:var(--red)">' + fmt(expense) + '</span></span>' +
        '</div>' +
    '</div>';

    c.innerHTML = formHtml + historyHtml;
}

function setHistoryFilter(f) {
    historyFilter = f;
    renderFiltersBar();
    renderBalance(document.getElementById('mainContent'));
}

/* =========================================================================
   ОПЕРАЦИЯ С ОСТАТКОМ
   ========================================================================= */
function doOp(sign) {
    var amtInput  = document.getElementById('opAmount');
    var descInput = document.getElementById('opDesc');
    if (!amtInput || !descInput) return;

    var amt = parseAmount(amtInput.value);
    if (amt === null) {
        try { amtInput.focus(); } catch (_) {}
        return;
    }

    var desc = descInput.value.trim();
    var opType = (sign > 0) ? TYPE.INCOME : TYPE.EXPENSE;
    showCategoryPicker(amt, desc, opType, null);
}

function applyOp(sign, amt, desc, categoryId) {
    var delta = amt * sign;

    if (sign < 0 && state.balance + delta < 0) {
        showConfirm(
            'Баланс станет отрицательным',
            'После операции остаток: ' + fmt(state.balance + delta) + '. Продолжить?',
            function () { commitOp(sign, amt, desc, categoryId, delta); },
            { danger: true, okLabel: 'Всё равно списать' }
        );
        return;
    }
    commitOp(sign, amt, desc, categoryId, delta);
}

function commitOp(sign, amt, desc, categoryId, delta) {
    state.balance += delta;

    var record = {
        id: uid(),
        date: new Date().toISOString(),
        type: sign > 0 ? TYPE.INCOME : TYPE.EXPENSE,
        desc: desc,
        amount: delta
    };
    if (categoryId) record.categoryId = categoryId;

    state.history.unshift(record);

    saveState();
    hideModal();
    renderBalance(document.getElementById('mainContent'));
}

/* =========================================================================
   МОДАЛКА ВЫБОРА КАТЕГОРИИ
   ========================================================================= */
var _pendingOp = null;

function showCategoryPicker(amt, desc, opType, preselectId) {
    _pendingOp = { amt: amt, desc: desc, opType: opType, catId: preselectId || null };

    var list = getCategoriesByType(opType);
    var isIncome = (opType === TYPE.INCOME);
    var title = isIncome ? 'Откуда пришло?' : 'Куда потратил?';
    var amountStr = (isIncome ? '+' : '−') + fmt(amt);
    var amountColor = isIncome ? 'var(--green)' : 'var(--red)';

    var buttonsHtml = '';
    for (var i = 0; i < list.length; i++) {
        var cat = list[i];
        var active = (preselectId === cat.id) ? ' active' : '';
        buttonsHtml +=
            '<button type="button" class="cat-btn' + active + '" ' +
                'data-action="cat-pick" data-id="' + esc(cat.id) + '">' +
                '<span class="cat-icon">' + cat.icon + '</span>' +
                '<span>' + esc(cat.name) + '</span>' +
            '</button>';
    }

    showModal(
        '<h3>' + title + '</h3>' +
        '<div class="cat-amount" style="color:' + amountColor + '">' + amountStr + '</div>' +
        (desc ? '<div class="cat-desc">' + esc(desc) + '</div>' : '') +
        '<div class="cat-list">' + buttonsHtml + '</div>' +
        '<button type="button" class="btn-full btn-outline" data-action="cat-cancel">Отмена</button>'
    );
}

function pickCategory(catId) {
    if (!_pendingOp) return;
    var amt = _pendingOp.amt;
    var desc = _pendingOp.desc;
    var opType = _pendingOp.opType;
    _pendingOp = null;
    hideModal();
    var sign = (opType === TYPE.INCOME) ? 1 : -1;
    applyOp(sign, amt, desc, catId);
}

function cancelCategoryPicker() {
    _pendingOp = null;
    hideModal();
    var amtInput = document.getElementById('opAmount');
    if (amtInput) { try { amtInput.focus(); } catch (_) {} }
}

// === ЧАСТЬ 5 ЗАКОНЧЕНА ===

/* =========================================================================
   ХЕЛПЕР: спиннеры даты
   ========================================================================= */
function buildDateSelectsHtml(iso, prefix) {
    var parts = dateToParts(iso);
    var years = getYearRange();
    var maxDay = daysInMonth(parts.month, parts.year);

    var dayHtml = '<select id="' + prefix + 'Day">';
    for (var d = 1; d <= maxDay; d++) {
        dayHtml += '<option value="' + d + '"' + (d === parts.day ? ' selected' : '') + '>' + d + '</option>';
    }
    dayHtml += '</select>';

    var monthHtml = '<select id="' + prefix + 'Month">';
    for (var m = 1; m <= 12; m++) {
        monthHtml += '<option value="' + m + '"' + (m === parts.month ? ' selected' : '') + '>' +
            MONTHS_FULL[m - 1] + '</option>';
    }
    monthHtml += '</select>';

    var yearHtml = '<select id="' + prefix + 'Year">';
    for (var y = 0; y < years.length; y++) {
        yearHtml += '<option value="' + years[y] + '"' + (years[y] === parts.year ? ' selected' : '') + '>' +
            years[y] + '</option>';
    }
    yearHtml += '</select>';

    return '<div class="date-selects">' + dayHtml + monthHtml + yearHtml + '</div>';
}

function readDateSelects(prefix, sourceIso) {
    var dEl = document.getElementById(prefix + 'Day');
    var mEl = document.getElementById(prefix + 'Month');
    var yEl = document.getElementById(prefix + 'Year');
    if (!dEl || !mEl || !yEl) return sourceIso || new Date().toISOString();

    var day = parseInt(dEl.value, 10);
    var month = parseInt(mEl.value, 10);
    var year = parseInt(yEl.value, 10);
    var maxDay = daysInMonth(month, year);
    if (day > maxDay) day = maxDay;
    return partsToIso(day, month, year, sourceIso);
}

function saveDebt(id) {
    var toEl = document.getElementById('debtTo');
    var amtEl = document.getElementById('debtAmt');
    var to = toEl ? toEl.value.trim() : '';
    var amt = amtEl ? parseAmount(amtEl.value) : null;
    if (!to || amt === null) return;

    var existing = (id != null) ? state.debts.filter(function (x) { return x.id === id; })[0] : null;
    var sourceIso = existing ? existing.createdAt : new Date().toISOString();
    var newIso = readDateSelects('debt', sourceIso);

    if (existing) {
        existing.to = to;
        existing.amount = amt;
        existing.createdAt = newIso;
    } else {
        state.debts.push({
            id: uid(),
            to: to,
            amount: amt,
            createdAt: newIso
        });
    }

    saveState();
    hideModal();
    renderDebts(document.getElementById('mainContent'));
}

function payDebt(id, amount) {
    var d = null;
    for (var i = 0; i < state.debts.length; i++) {
        if (state.debts[i].id === id) { d = state.debts[i]; break; }
    }
    if (!d) return;

    var amt = parseAmount(amount);
    if (amt === null) return;

    if (amt > d.amount) {
        alert('Сумма больше остатка долга (' + fmt(d.amount) + ').');
        return;
    }
    if (amt > state.balance) {
        alert('Недостаточно средств.\nНужно: ' + fmt(amt) + '\nДоступно: ' + fmt(state.balance));
        return;
    }

    state.balance -= amt;
    d.amount -= amt;

    var isFull = d.amount <= 0.0001;
    var descText = isFull
        ? DEBT_FULL_PREFIX + d.to
        : DEBT_PARTIAL_PREFIX + d.to + DEBT_PARTIAL_MARKER + fmt(d.amount) + ')';

    state.history.unshift({
        id: uid(),
        date: new Date().toISOString(),
        type: TYPE.TRANSFER,
        desc: descText,
        amount: -amt
    });

    if (isFull) {
        state.debts = state.debts.filter(function (x) { return x.id !== id; });
    }

    saveState();
    renderHeader();
    renderDebts(document.getElementById('mainContent'));
}

}

function movePlan(id, dir) {
    var idx = -1;
    for (var i = 0; i < state.plans.length; i++) {
        if (state.plans[i].id === id) { idx = i; break; }
    }
    if (idx === -1) return;
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= state.plans.length) return;

    var tmp = state.plans[idx];
    state.plans[idx] = state.plans[newIdx];
    state.plans[newIdx] = tmp;

    saveState();
    renderPlans(document.getElementById('mainContent'));
}

function savePlan(id) {

    var targetEl = document.getElementById('planTarget');
    var name = nameEl ? nameEl.value.trim() : '';
    var target = targetEl ? parseAmount(targetEl.value) : null;

function fundPlan(id) {

        if (state.plans[i].id === id) { p = state.plans[i]; break; }

    if (!p) return;

    state.balance -= amt;

        date: new Date().toISOString(),

        desc: 'Вклад в цель: ' + p.name,

    hideModal();

function delPlan(id) {

    for (var i = 0; i < state.plans.length; i++) {
        if (state.plans[i].id === id) { p = state.plans[i]; break; }
    }
    if (!p) return;

    var refund = p.current;
    var text = refund > 0
        ? 'Накопленные ' + fmt(refund) + ' вернутся на баланс.'

    showConfirm(
        'Удалить цель "' + p.name + '"?',

        function () {
            state.balance += refund;
            if (refund > 0) {
                state.history.unshift({
                    id: uid(),
                    date: new Date().toISOString(),
                    type: TYPE.TRANSFER,
                    desc: 'Отмена цели: ' + p.name + ' (возврат)',

            state.plans = state.plans.filter(function (x) { return x.id !== id; });
            saveState();
            renderPlans(document.getElementById('mainContent'));

        { danger: true, okLabel: 'Удалить' }

}

function editPickCategory(catId) {
    if (!_editState.id) return;

    var item = null;
    for (var i = 0; i < state.history.length; i++) {
        if (state.history[i].id === _editState.id) { item = state.history[i]; break; }
    }
    if (!item) return;

    captureEditFields();
    _editState.catId = catId;
    renderEditHistoryModal(item);
}

function saveEditedHistory(id) {
    var item = null;
    for (var i = 0; i < state.history.length; i++) {
        if (state.history[i].id === id) { item = state.history[i]; break; }
    }
    if (!item) return;

    captureEditFields();

    var newAbs = parseAmount(_editState.amount);
    if (newAbs === null) {
        var amtEl = document.getElementById('editAmount');
        if (amtEl) { try { amtEl.focus(); } catch (_) {} }
        return;
    }

    var oldAmount = item.amount;
    var sign = oldAmount < 0 ? -1 : 1;
    var newAmount = newAbs * sign;

    var delta = newAmount - oldAmount;
    state.balance += delta;

    item.amount = newAmount;
    item.desc = _editState.desc.trim();
    item.date = _editState.dateIso;

    if (item.type === TYPE.EXPENSE) {
        item.categoryId = _editState.catId || DEFAULT_CATEGORY_ID;
    } else if (item.type === TYPE.INCOME) {
        item.categoryId = _editState.catId || DEFAULT_INCOME_CATEGORY_ID;
    } else {
        delete item.categoryId;
    }

    saveState();
    hideModal();
    renderBalance(document.getElementById('mainContent'));
}

    setTimeout(function () {
        showDeleteHistoryItem(id, { refund: false, restore: false });

/* =========================================================================
   МОДАЛКА УДАЛЕНИЯ ИСТОРИИ
   ========================================================================= */
var _delHistState = { id: null, refund: false, restore: false };

function showDeleteHistoryItem(id, opts) {
    opts = opts || {};

    var item = null;
    for (var i = 0; i < state.history.length; i++) {
        if (state.history[i].id === id) { item = state.history[i]; break; }
    }
    if (!item) return;

    var refundVal  = (typeof opts.refund  === 'boolean') ? opts.refund  : false;
    var restoreVal = (typeof opts.restore === 'boolean') ? opts.restore : false;
    if (!refundVal && restoreVal) restoreVal = false;

    _delHistState.id = id;
    _delHistState.refund = refundVal;
    _delHistState.restore = restoreVal;

    var isPos = item.amount > 0;
    var sign  = isPos ? '+' : '';
    var amountClass = isPos ? 'pos' : 'neg';

    var debtInfo = parseDebtReturn(item.desc);
    var canRestoreDebt = !!debtInfo;

    var balanceHint;
    if (refundVal) {
        var newBalance = state.balance - item.amount;
        balanceHint = 'Новый баланс: ' + fmt(newBalance);
    } else {
        balanceHint = 'Баланс не изменится';
    }

    var restoreHint = '';
    if (canRestoreDebt) {
        if (!refundVal) {
            restoreHint = 'Сначала включи «Вернуть деньги на баланс»';
        } else {
            var matches = state.debts.filter(function (d) { return d.to === debtInfo.to; });
            if (matches.length === 1) {
                restoreHint = 'Прибавится к долгу «' + debtInfo.to + '» (' +
                    fmt(matches[0].amount) + ' + ' + fmt(Math.abs(item.amount)) + ')';
            } else if (matches.length === 0) {
                restoreHint = 'Создастся новый долг «' + debtInfo.to + '» на ' + fmt(Math.abs(item.amount));
            } else {
                restoreHint = 'Найдено несколько долгов «' + debtInfo.to + '» — создастся новый';
            }
        }
    }

    var refundRow =
        '<label class="checkbox-row" for="cbRefund">' +
            '<input type="checkbox" id="cbRefund"' + (refundVal ? ' checked' : '') + '>' +
            '<span class="cb-label">Вернуть деньги на баланс' +
                '<span class="cb-hint">' + esc(balanceHint) + '</span>' +
            '</span>' +
        '</label>';

    var restoreRow = '';
    if (canRestoreDebt) {
        var restoreDisabled = !refundVal;
        restoreRow =
            '<label class="checkbox-row' + (restoreDisabled ? ' disabled' : '') + '" for="cbRestoreDebt">' +
                '<input type="checkbox" id="cbRestoreDebt"' +
                    (restoreVal ? ' checked' : '') +
                    (restoreDisabled ? ' disabled' : '') + '>' +
                '<span class="cb-label">Восстановить долг «' + esc(debtInfo.to) + '»' +
                    '<span class="cb-hint">' + esc(restoreHint) + '</span>' +
                '</span>' +
            '</label>';
    }

    showModal(
        '<h3>Удалить операцию?</h3>' +
        '<div class="history-summary">' +
            '<div class="h-title">' + (esc(item.desc) || 'Без описания') + '</div>' +
            '<div class="h-meta">' + formatDateTime(item.date) + '</div>' +
            '<div class="h-amount ' + amountClass + '">' + sign + fmt(item.amount) + '</div>' +
        '</div>' +
        refundRow +
        restoreRow +
        '<div class="btn-row" style="margin-top:12px;">' +
            '<button type="button" class="btn-full btn-secondary" data-action="close-modal">Отмена</button>' +
            '<button type="button" class="btn-full btn-danger" data-action="history-confirm-del" ' +
                'data-id="' + esc(id) + '" ' +
                'data-refund="' + (refundVal ? '1' : '0') + '" ' +
                'data-restore="' + (restoreVal ? '1' : '0') + '">Удалить</button>' +
        '</div>'
    );
}

function handleRefundToggle(checked) {
    var id = _delHistState.id;
    if (!id) return;
    var restore = _delHistState.restore;
    if (!checked) restore = false;
    showDeleteHistoryItem(id, { refund: checked, restore: restore });
}

function handleRestoreToggle(checked) {
    var id = _delHistState.id;
    if (!id) return;
    if (!_delHistState.refund) return;
    showDeleteHistoryItem(id, { refund: true, restore: checked });
}

function deleteHistoryItem(id, refund, restore) {
    var item = null;
    for (var i = 0; i < state.history.length; i++) {
        if (state.history[i].id === id) { item = state.history[i]; break; }
    }
    if (!item) return;

    if (refund) {
        state.balance -= item.amount;
    }

    if (restore && refund) {
        var debtInfo = parseDebtReturn(item.desc);
        if (debtInfo) {
            var restoreAmount = Math.abs(item.amount);
            var matches = state.debts.filter(function (d) { return d.to === debtInfo.to; });

            if (matches.length === 1) {
                matches[0].amount += restoreAmount;
            } else {
                state.debts.push({
                    id: uid(),
                    to: debtInfo.to,
                    amount: restoreAmount,
                    createdAt: new Date().toISOString()
                });
            }
        }
    }

    state.history = state.history.filter(function (h) { return h.id !== id; });

    saveState();
    hideModal();

    var c = document.getElementById('mainContent');
    if (currentTab === 'balance')        renderBalance(c);
    else if (currentTab === 'debts')     renderDebts(c);
    else if (currentTab === 'plans')     renderPlans(c);
    else if (currentTab === 'analytics') renderAnalytics(c);
    else if (currentTab === 'settings')  renderSettings(c);
}

/* =========================================================================
   ANALYTICS — группировка по таймфреймам
   ========================================================================= */
function buildChartData(tfId) {
    var tf = null;
    for (var i = 0; i < TIMEFRAMES.length; i++) {
        if (TIMEFRAMES[i].id === tfId) { tf = TIMEFRAMES[i]; break; }
    }
    if (!tf) tf = TIMEFRAMES[0];

    var now = new Date();
    var todayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

    var startDate;
    if (tf.unit === 'day') {
        startDate = new Date(todayEnd);
        startDate.setDate(startDate.getDate() - tf.days + 1);
        startDate.setHours(0, 0, 0, 0);
    } else if (tf.unit === 'week') {
        startDate = new Date(todayEnd);
        var dow = startDate.getDay();
        var diffToMon = (dow + 6) % 7;
        startDate.setDate(startDate.getDate() - diffToMon - 11 * 7);
        startDate.setHours(0, 0, 0, 0);
    } else if (tf.unit === 'month') {
        startDate = new Date(now.getFullYear(), now.getMonth() - 11, 1, 0, 0, 0);
    } else if (tf.unit === 'q') {
        var currentQ = Math.floor(now.getMonth() / 3);
        startDate = new Date(now.getFullYear(), (currentQ - 7) * 3, 1, 0, 0, 0);
    } else {
        startDate = new Date(now.getFullYear() - 4, 0, 1, 0, 0, 0);
    }

    var slots = [];

    if (tf.unit === 'day') {
        var cur = new Date(startDate);
        while (cur <= todayEnd) {
            var dayEnd = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate(), 23, 59, 59, 999);
            slots.push({
                start: new Date(cur), end: dayEnd,
                label: formatDayLabel(cur),
                income: 0, expense: 0, ops: 0
            });
            cur.setDate(cur.getDate() + 1);
        }
    } else if (tf.unit === 'week') {
        var w = new Date(startDate);
        while (w <= todayEnd) {
            var wEnd = new Date(w);
            wEnd.setDate(wEnd.getDate() + 6);
            wEnd.setHours(23, 59, 59, 999);
            slots.push({
                start: new Date(w), end: wEnd,
                label: formatWeekLabel(w),
                income: 0, expense: 0, ops: 0
            });
            var next = new Date(w);
            next.setDate(next.getDate() + 7);
            w = next;
        }
    } else if (tf.unit === 'month') {
        var m = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
        while (m <= now) {
            var mEnd = new Date(m.getFullYear(), m.getMonth() + 1, 0, 23, 59, 59, 999);
            slots.push({
                start: new Date(m), end: mEnd,
                label: formatMonthLabel(m),
                income: 0, expense: 0, ops: 0
            });
            m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
        }
    } else if (tf.unit === 'q') {
        var q = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
        while (q <= now) {
            var qEnd = new Date(q.getFullYear(), q.getMonth() + 3, 0, 23, 59, 59, 999);
            slots.push({
                start: new Date(q), end: qEnd,
                label: formatQuarterLabel(q),
                income: 0, expense: 0, ops: 0
            });
            q = new Date(q.getFullYear(), q.getMonth() + 3, 1);
        }
    } else {
        var y = new Date(startDate.getFullYear(), 0, 1);
        while (y <= now) {
            var yEnd = new Date(y.getFullYear(), 11, 31, 23, 59, 59, 999);
            slots.push({
                start: new Date(y), end: yEnd,
                label: String(y.getFullYear()),
                income: 0, expense: 0, ops: 0
            });
            y = new Date(y.getFullYear() + 1, 0, 1);
        }
    }

    var balanceBefore = state.balance;
    for (var k = 0; k < state.history.length; k++) {
        balanceBefore -= state.history[k].amount;
    }

    var sorted = state.history.slice().sort(function (a, b) {
        return new Date(a.date) - new Date(b.date);
    });

    var running = balanceBefore;
    var hIdx = 0;

    for (var s = 0; s < slots.length; s++) {
        var slot = slots[s];
        while (hIdx < sorted.length) {
            var h = sorted[hIdx];
            var hTs = new Date(h.date).getTime();
            if (hTs < slot.start.getTime()) {
                running += h.amount;
                hIdx++;
                continue;
            }
            if (hTs > slot.end.getTime()) break;

            running += h.amount;
            if (h.amount > 0) slot.income += h.amount;
            else if (h.amount < 0) slot.expense += Math.abs(h.amount);
            slot.ops++;
            hIdx++;
        }
        slot.balanceEnd = running;
    }

    return slots;
}

function formatDayLabel(d) { return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()]; }
function formatWeekLabel(d) { return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()]; }
function formatMonthLabel(d) { return MONTHS_SHORT[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2); }
function formatQuarterLabel(d) {
    var q = Math.floor(d.getMonth() / 3) + 1;
    return 'Q' + q + ' ' + String(d.getFullYear()).slice(2);
}

function formatPeriodFull(slot, tfId) {
    if (tfId === 'D1') {
        return slot.start.getDate() + ' ' + MONTHS_FULL[slot.start.getMonth()] + ' ' + slot.start.getFullYear();
    }
    if (tfId === 'W1') {
        var s = slot.start;
        var e = slot.end;
        var sStr = s.getDate() + ' ' + MONTHS_SHORT[s.getMonth()];
        var eStr = e.getDate() + ' ' + MONTHS_SHORT[e.getMonth()];
        return sStr + ' — ' + eStr + ' ' + s.getFullYear();
    }
    if (tfId === 'M1') {
        return MONTHS_FULL[slot.start.getMonth()] + ' ' + slot.start.getFullYear();
    }
    if (tfId === 'M3') {
        var q = Math.floor(slot.start.getMonth() / 3) + 1;
        return 'Квартал ' + q + ', ' + slot.start.getFullYear();
    }
    return 'Год ' + slot.start.getFullYear();
}

/* =========================================================================
   ANALYTICS — Canvas
   ========================================================================= */
function initCanvasHiDPI(canvas, cssW, cssH) {
    var dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    canvas.style.width  = cssW + 'px';
    canvas.style.height = cssH + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
}

function drawChart(canvas, slots, tfId) {
    if (!canvas || !slots || slots.length === 0) return;

    var wrap = canvas.parentNode;
    var cssW = wrap.clientWidth;
    var cssH = 320;
    var ctx = initCanvasHiDPI(canvas, cssW, cssH);

    var PAD_L = 44, PAD_R = 12, PAD_T = 12, PAD_B = 22;
    var GAP = 6, VOL_H = 60;

    var chartW = cssW - PAD_L - PAD_R;
    var chartH = cssH - PAD_T - PAD_B - GAP - VOL_H;

    var lineTop = PAD_T;
    var lineBot = PAD_T + chartH;
    var volTop  = lineBot + GAP;
    var volBot  = volTop + VOL_H;

    var C_GRID  = '#2a3548';
    var C_AXIS  = '#3a4558';
    var C_TEXT  = '#8b9bb4';
    var C_LINE  = '#00d2ff';
    var C_GREEN = '#00d26a';
    var C_RED   = '#ff4757';

    ctx.clearRect(0, 0, cssW, cssH);

    var minBal = Infinity, maxBal = -Infinity;
    for (var i = 0; i < slots.length; i++) {
        var b = slots[i].balanceEnd;
        if (b < minBal) minBal = b;
        if (b > maxBal) maxBal = b;
    }
    if (!isFinite(minBal)) { minBal = 0; maxBal = 1; }
    if (minBal === maxBal) { minBal -= 1; maxBal += 1; }

    var range = maxBal - minBal;
    minBal -= range * 0.05;
    maxBal += range * 0.05;
    if (minBal > 0 && minBal < range * 0.5) minBal = 0;
    if (maxBal < 0 && maxBal > -range * 0.5) maxBal = 0;

    var yRange = maxBal - minBal;
    if (yRange === 0) yRange = 1;

    function yForBalance(b) {
        return lineBot - ((b - minBal) / yRange) * chartH;
    }

    var maxVol = 0;
    for (var v = 0; v < slots.length; v++) {
        if (slots[v].income  > maxVol) maxVol = slots[v].income;
        if (slots[v].expense > maxVol) maxVol = slots[v].expense;
    }
    if (maxVol === 0) maxVol = 1;
    var volHalf = VOL_H / 2;

    var gridLines = 4;
    ctx.strokeStyle = C_GRID;
    ctx.fillStyle = C_TEXT;
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 1;

    for (var g = 0; g <= gridLines; g++) {
        var val = minBal + (yRange * g / gridLines);
        var y = yForBalance(val);
        ctx.beginPath();
        ctx.moveTo(PAD_L, y);
        ctx.lineTo(PAD_L + chartW, y);
        ctx.stroke();
        ctx.fillText(fmtShort(val), PAD_L - 6, y);
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    var maxLabels = Math.max(3, Math.floor(chartW / 55));
    var labelEvery = Math.ceil(slots.length / maxLabels);
    for (var s2 = 0; s2 < slots.length; s2++) {
        if (s2 % labelEvery !== 0 && s2 !== slots.length - 1) continue;
        var lx = PAD_L + (chartW * (s2 + 0.5) / slots.length);
        ctx.fillText(slots[s2].label, lx, volBot + 4);
    }

    if (slots.length > 0) {
        var grad = ctx.createLinearGradient(0, lineTop, 0, lineBot);
        grad.addColorStop(0, 'rgba(0,210,255,0.18)');
        grad.addColorStop(1, 'rgba(0,210,255,0)');

        ctx.beginPath();
        for (var p = 0; p < slots.length; p++) {
            var px = PAD_L + (chartW * (p + 0.5) / slots.length);
            var py = yForBalance(slots[p].balanceEnd);
            if (p === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        var lastX = PAD_L + (chartW * (slots.length - 0.5) / slots.length);
        var firstX = PAD_L + (chartW * 0.5 / slots.length);
        ctx.lineTo(lastX, lineBot);
        ctx.lineTo(firstX, lineBot);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.beginPath();
        for (var p2 = 0; p2 < slots.length; p2++) {
            var px2 = PAD_L + (chartW * (p2 + 0.5) / slots.length);
            var py2 = yForBalance(slots[p2].balanceEnd);
            if (p2 === 0) ctx.moveTo(px2, py2);
            else ctx.lineTo(px2, py2);
        }
        ctx.strokeStyle = C_LINE;
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.stroke();

        if (slots.length <= 40) {
            ctx.fillStyle = C_LINE;
            for (var p3 = 0; p3 < slots.length; p3++) {
                var px3 = PAD_L + (chartW * (p3 + 0.5) / slots.length);
                var py3 = yForBalance(slots[p3].balanceEnd);
                ctx.beginPath();
                ctx.arc(px3, py3, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    ctx.strokeStyle = C_AXIS;
    ctx.beginPath();
    ctx.moveTo(PAD_L, volTop + volHalf);
    ctx.lineTo(PAD_L + chartW, volTop + volHalf);
    ctx.stroke();

    var slotW = chartW / slots.length;
    var barW = Math.max(1, Math.min(slotW * 0.7, 20));

    for (var bx = 0; bx < slots.length; bx++) {
        var sl = slots[bx];
        var cx = PAD_L + slotW * (bx + 0.5);

        if (sl.income > 0) {
            var hInc = (sl.income / maxVol) * volHalf;
            ctx.fillStyle = C_GREEN;
            ctx.fillRect(cx - barW / 2, volTop + volHalf - hInc, barW, hInc);
        }
        if (sl.expense > 0) {
            var hExp = (sl.expense / maxVol) * volHalf;
            ctx.fillStyle = C_RED;
            ctx.fillRect(cx - barW / 2, volTop + volHalf, barW, hExp);
        }
    }

    ctx.strokeStyle = C_AXIS;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD_L, lineTop);
    ctx.lineTo(PAD_L, volBot);
    ctx.stroke();
}
